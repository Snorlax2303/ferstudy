<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔧 Teste Firebase - Ferstudy</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
  }
  .container {
    background: rgba(20, 20, 40, 0.8);
    border: 1px solid rgba(100, 150, 220, 0.3);
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
  }
  h1 { color: #667eea; margin-top: 0; }
  h2 { color: #aaa; font-size: 16px; margin-top: 0; }
  .status {
    padding: 15px;
    border-radius: 8px;
    margin: 10px 0;
    font-family: monospace;
    font-size: 13px;
    border-left: 4px solid;
  }
  .ok { background: rgba(74, 222, 128, 0.1); border-left-color: #4ade80; color: #86efac; }
  .error { background: rgba(239, 68, 68, 0.1); border-left-color: #ef4444; color: #fca5a5; }
  .warn { background: rgba(245, 158, 11, 0.1); border-left-color: #f59e0b; color: #fcd34d; }
  .pending { background: rgba(59, 130, 246, 0.1); border-left-color: #3b82f6; color: #93c5fd; }
  
  .button-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 20px 0;
  }
  button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.2s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  button:disabled { background: #444; cursor: not-allowed; }
  
  .log {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    margin-top: 20px;
    max-height: 500px;
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  .log-entry {
    margin: 5px 0;
    padding: 5px 10px;
    border-left: 3px solid;
    border-radius: 2px;
  }
  .log-entry.error { border-left-color: #ef4444; color: #fca5a5; }
  .log-entry.warn { border-left-color: #f59e0b; color: #fcd34d; }
  .log-entry.ok { border-left-color: #4ade80; color: #86efac; }
  .log-entry.info { border-left-color: #3b82f6; color: #93c5fd; }
  
  .form-group {
    margin: 15px 0;
  }
  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
    color: #ccc;
  }
  .form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid rgba(100, 150, 220, 0.3);
    border-radius: 6px;
    background: rgba(30, 30, 50, 0.7);
    color: #fff;
    font-size: 14px;
  }
  .form-group input:focus {
    outline: none;
    border-color: #667eea;
    background: rgba(30, 30, 50, 0.9);
  }
  
  .badge {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin: 5px 5px 5px 0;
  }
  .badge-ok { background: rgba(74, 222, 128, 0.2); color: #86efac; }
  .badge-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
  .badge-pending { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
  
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 800px) {
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🔧 Teste Firebase - Ferstudy</h1>
  <h2>Verifique se o Firebase está inicializando corretamente</h2>

  <div id="status-container"></div>

  <div class="button-group">
    <button onclick="checkStatus()">🔍 Verificar Status</button>
    <button onclick="checkScripts()">📦 Verificar Scripts</button>
    <button onclick="reloadPage()">🔄 Recarregar Página</button>
    <button onclick="clearLog()">🗑️ Limpar Log</button>
  </div>

  <div class="log" id="log"></div>
</div>

<div class="grid-2">
  <div class="container">
    <h2>📝 Teste de Registro</h2>
    <div class="form-group">
      <label>E-mail:</label>
      <input type="email" id="signup-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha:</label>
      <input type="password" id="signup-password" value="123456" placeholder="Mínimo 6 caracteres">
    </div>
    <div class="button-group">
      <button onclick="testSignup()">📝 Registrar</button>
    </div>
  </div>

  <div class="container">
    <h2>🔐 Teste de Login</h2>
    <div class="form-group">
      <label>E-mail:</label>
      <input type="email" id="login-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha:</label>
      <input type="password" id="login-password" value="123456" placeholder="Mínimo 6 caracteres">
    </div>
    <div class="button-group">
      <button onclick="testLogin()">🔐 Login</button>
      <button onclick="testLogout()">🚪 Logout</button>
    </div>
  </div>
</div>

<script>
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status-container');

  function log(message, type = 'info') {
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    const timestamp = new Date().toLocaleTimeString();
    entry.textContent = `[${timestamp}] ${message}`;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(`[${type.toUpperCase()}] ${message}`);
  }

  function clearLog() {
    logEl.innerHTML = '';
  }

  function reloadPage() {
    location.reload();
  }

  function checkStatus() {
    statusEl.innerHTML = '';
    
    const checks = [
      { name: 'Firebase CDN', check: () => typeof firebase !== 'undefined', icon: '📦' },
      { name: 'Firebase apps', check: () => typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0, icon: '🚀' },
      { name: 'window.db', check: () => typeof window.db !== 'undefined' && window.db !== null, icon: '📊' },
      { name: 'window.auth', check: () => typeof window.auth !== 'undefined' && window.auth !== null, icon: '🔐' },
      { name: 'firebaseReady', check: () => window.firebaseReady === true, icon: '✅' },
    ];

    log('=== VERIFICANDO STATUS ===');

    checks.forEach(check => {
      const ok = check.check();
      const badgeClass = ok ? 'badge-ok' : 'badge-error';
      const badge = ok ? '✅' : '❌';
      const className = ok ? 'ok' : 'error';
      
      const div = document.createElement('div');
      div.className = `status ${className}`;
      div.innerHTML = `<span class="badge ${badgeClass}">${badge} ${check.name}</span>: ${ok ? 'OK' : 'ERRO'}`;
      statusEl.appendChild(div);
      
      log(`${badge} ${check.name}: ${ok ? 'OK' : 'ERRO'}`, ok ? 'ok' : 'error');
    });

    // Info adicional
    if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0) {
      const app = firebase.apps[0];
      log(`Firebase App Name: ${app.name}`, 'info');
      log(`Firebase Project ID: ${app.options.projectId}`, 'info');
    }
    
    if (window.firebaseError) {
      log(`Firebase Error: ${window.firebaseError}`, 'error');
    }
  }

  function checkScripts() {
    log('=== VERIFICANDO SCRIPTS ===');
    
    const scripts = document.querySelectorAll('script[src*="firebase"]');
    if (scripts.length === 0) {
      log('❌ NENHUM script do Firebase encontrado!', 'error');
      return;
    }

    log(`✅ Encontrados ${scripts.length} scripts do Firebase`, 'ok');
    scripts.forEach((script, i) => {
      log(`  ${i + 1}. ${script.src.substring(script.src.lastIndexOf('/') + 1)}`, 'info');
    });
  }

  async function testSignup() {
    log('=== TESTE DE REGISTRO ===');
    
    if (!window.auth) {
      log('❌ Firebase Auth não inicializado!', 'error');
      return;
    }

    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;

    if (!email || !password) {
      log('❌ Preencha e-mail e senha', 'error');
      return;
    }

    try {
      log(`📝 Tentando registrar: ${email}`, 'pending');
      const result = await window.auth.createUserWithEmailAndPassword(email, password);
      log(`✅ Usuário registrado com sucesso!`, 'ok');
      log(`UID: ${result.user.uid}`, 'ok');
      document.getElementById('signup-email').value = '';
    } catch (error) {
      log(`❌ Erro: ${error.code}`, 'error');
      log(`Mensagem: ${error.message}`, 'error');
    }
  }

  async function testLogin() {
    log('=== TESTE DE LOGIN ===');
    
    if (!window.auth) {
      log('❌ Firebase Auth não inicializado!', 'error');
      return;
    }

    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    if (!email || !password) {
      log('❌ Preencha e-mail e senha', 'error');
      return;
    }

    try {
      log(`🔐 Tentando login: ${email}`, 'pending');
      const result = await window.auth.signInWithEmailAndPassword(email, password);
      log(`✅ Login bem-sucedido!`, 'ok');
      log(`Email: ${result.user.email}`, 'ok');
    } catch (error) {
      log(`❌ Erro: ${error.code}`, 'error');
      log(`Mensagem: ${error.message}`, 'error');
    }
  }

  async function testLogout() {
    log('=== TESTE DE LOGOUT ===');
    
    if (!window.auth) {
      log('❌ Firebase Auth não inicializado!', 'error');
      return;
    }

    try {
      log(`🚪 Fazendo logout...`, 'pending');
      await window.auth.signOut();
      log(`✅ Logout bem-sucedido!`, 'ok');
    } catch (error) {
      log(`❌ Erro: ${error.code}`, 'error');
    }
  }

  // Auto-check ao carregar
  window.addEventListener('load', () => {
    log('🚀 Página carregada!', 'info');
    setTimeout(() => {
      checkStatus();
    }, 2000);
  });

  // Mostrar status inicial
  setTimeout(() => {
    checkStatus();
  }, 1000);
</script>

<!-- Firebase CDN (ORDEM CORRETA E IMPORTANTE!) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>

<!-- Firebase Config -->
<script src="ferstudy/firebase-config.js"></script>

</body>
</html>
