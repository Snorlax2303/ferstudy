<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferstudy — Calendário de Estudos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ferstudy/styles.css?v=3">
</head>
<body data-theme="blue" data-density="comfy">
<div id="root"></div>

<!-- React -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Firebase CDN (versão COMPAT — cria o objeto global `firebase`) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
  console.log("⏳ Verificando Firebase compat...");
  if (typeof firebase !== 'undefined') {
    console.log("✅ Firebase CDN (compat) carregado!");
  } else {
    console.error("❌ Firebase compat NÃO carregou — verifique sua conexão / bloqueadores.");
  }
</script>

<!-- Firebase config NÃO precisa do Babel (é JS puro) -->
<script src="ferstudy/firebase-config.js"></script>

<!-- Arquivos JSX do app (precisam do Babel) -->
<script type="text/babel" src="ferstudy/data.jsx"></script>
<script type="text/babel" src="ferstudy/icons.jsx"></script>
<script type="text/babel" src="ferstudy/tweaks-panel.jsx"></script>
<script type="text/babel" src="ferstudy/modal.jsx"></script>
<script type="text/babel" src="ferstudy/views.jsx"></script>
<script type="text/babel" src="ferstudy/screens.jsx"></script>
<script type="text/babel" src="ferstudy/app.jsx"></script>
</body>
</html>
